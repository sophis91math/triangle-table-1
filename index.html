<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>특수각의 삼각비 교구 웹앱</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX CDN for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f1f5f9;
        }
        .katex { font-size: 1.25rem !important; }
        .cell-transition {
            transition: all 0.2s ease-in-out;
        }
        .bg-image-mode {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Navigation Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-500 rounded-lg text-white text-xl">
                    <i class="fa-solid fa-shapes"></i>
                </div>
                <div>
                <h1 class="text-xl font-bold tracking-tight">특수각의 삼각비 교구 웹앱</h1>
                <p class="text-xs text-indigo-200">중학교 3학년 수학 | $0^\circ$부터 $90^\circ$까지 삼각비의 값</p>
            </div>
        </div>

        <!-- Top Menu Buttons -->
        <div class="flex items-center space-x-3">
            <a href="https://joo.is/삼각비-2단계" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 text-white bg-indigo-500/80 hover:bg-indigo-500 transition border border-indigo-400/40 shadow-sm">
                <i class="fa-solid fa-pen-to-square"></i> 형성평가
                <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-75"></i>
            </a>
            <a href="https://dashboard.blooket.com/set/6a729e37138ba5eafd1355f2" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 text-white bg-indigo-500/80 hover:bg-indigo-500 transition border border-indigo-400/40 shadow-sm">
                <i class="fa-solid fa-gamepad"></i> 블루킷
                <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-75"></i>
            </a>
        </div>
    </div>
</header>

<!-- Main Content Container -->
<main id="mainContainer" class="flex-grow max-w-6xl w-full mx-auto p-4 sm:p-6 flex flex-col items-center">
    
    <!-- Action Toolbar -->
    <div class="w-full bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 flex flex-wrap justify-between items-center gap-4">
        <div class="flex flex-wrap items-center gap-2">
            <button onclick="showAllCells()" class="px-3.5 py-2 bg-slate-800 text-white rounded-lg text-sm font-medium hover:bg-slate-700 transition flex items-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-eye text-xs"></i> 모두 보기
            </button>
            <button onclick="hideAllCells()" class="px-3.5 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-300 transition flex items-center gap-1.5">
                <i class="fa-solid fa-eye-slash text-xs"></i> 모두 숨기기
            </button>
            <button id="speechAllBtn" onclick="speakAll()" class="px-3.5 py-2 bg-emerald-100 text-emerald-800 rounded-lg text-sm font-medium hover:bg-emerald-200 border border-emerald-300/60 transition flex items-center gap-1.5">
                <i class="fa-solid fa-volume-high text-xs"></i> <span id="speechBtnText">음성: 전체 읽기 (사인 삼십도는 2분의 1)</span>
            </button>
        </div>

        <div class="flex items-center gap-4 text-sm text-slate-600">
            <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-lg">
                <i class="fa-solid fa-gauge-high text-slate-500"></i>
                <label for="speechSpeed" class="text-xs font-medium text-slate-600">음성 속도:</label>
                <select id="speechSpeed" onchange="updateSpeechSpeed(this.value)" class="bg-transparent font-semibold text-slate-800 focus:outline-none cursor-pointer">
                    <option value="0.75">0.75x (천천히)</option>
                    <option value="1.0" selected>1.0x (보통)</option>
                    <option value="1.25">1.25x (빠르게)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Trigonometry Table Section -->
        <div class="w-full bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden mb-6">
            <div class="overflow-x-auto">
                <table class="w-full text-center border-collapse">
                    <thead>
                        <tr class="bg-slate-100/80 border-b border-slate-200 text-slate-600 text-lg font-serif">
                            <th class="p-4 border-r border-slate-200 w-1/6 font-normal">
                                <span class="text-xs font-sans text-slate-500 block mb-0.5">삼각비</span>
                                <span id="math-A"></span>
                            </th>
                            <th class="p-4 border-r border-slate-200 w-1/6 font-bold text-slate-800">0°</th>
                            <th class="p-4 border-r border-slate-200 w-1/6 font-bold text-slate-800">30°</th>
                            <th class="p-4 border-r border-slate-200 w-1/6 font-bold text-slate-800">45°</th>
                            <th class="p-4 border-r border-slate-200 w-1/6 font-bold text-slate-800">60°</th>
                            <th class="p-4 w-1/6 font-bold text-slate-800">90°</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                        <!-- Sin Row -->
                        <tr class="hover:bg-indigo-50/30 transition">
                            <td class="p-4 font-bold text-indigo-900 border-r border-slate-200 bg-slate-50/50 text-xl font-serif">
                                <span id="math-sin"></span>
                            </td>
                            <td class="p-2 border-r border-slate-200 cursor-pointer cell-transition" onclick="toggleCell('sin', '0')">
                                <div id="cell-sin-0" class="min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium"></div>
                            </td>
                            <td class="p-2 border-r border-slate-200 cursor-pointer cell-transition" onclick="toggleCell('sin', '30')">
                                <div id="cell-sin-30" class="min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium"></div>
                            </td>
                            <td class="p-2 border-r border-slate-200 cursor-pointer cell-transition" onclick="toggleCell('sin', '45')">
                                <div id="cell-sin-45" class="min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium"></div>
                            </td>
                            <td class="p-2 border-r border-slate-200 cursor-pointer cell-transition" onclick="toggleCell('sin', '60')">
                                <div id="cell-sin-60" class="min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium"></div>
                            </td>
                            <td class="p-2 cursor-pointer cell-transition" onclick="toggleCell('sin', '90')">
                                <div id="cell-sin-90" class="min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium"></div>
                            </td>
                        </tr>

                        <!-- Cos Row -->
                        <tr class="hover:bg-indigo-50/30 transition">
                            <td class="p-4 font-bold text-emerald-900 border-r border-slate-200 bg-slate-50/50 text-xl font-serif">
                                <span id="math-cos"></span>
                            </td>
                            <td class="p-2 border-r border-slate-200 cursor-pointer cell-transition" onclick="toggleCell('cos', '0')">
                                <div id="cell-cos-0" class="min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium"></div>
                            </td>
                            <td class="p-2 border-r border-slate-200 cursor-pointer cell-transition" onclick="toggleCell('cos', '30')">
                                <div id="cell-cos-30" class="min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium"></div>
                            </td>
                            <td class="p-2 border-r border-slate-200 cursor-pointer cell-transition" onclick="toggleCell('cos', '45')">
                                <div id="cell-cos-45" class="min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium"></div>
                            </td>
                            <td class="p-2 border-r border-slate-200 cursor-pointer cell-transition" onclick="toggleCell('cos', '60')">
                                <div id="cell-cos-60" class="min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium"></div>
                            </td>
                            <td class="p-2 cursor-pointer cell-transition" onclick="toggleCell('cos', '90')">
                                <div id="cell-cos-90" class="min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium"></div>
                            </td>
                        </tr>

                        <!-- Tan Row -->
                        <tr class="hover:bg-indigo-50/30 transition">
                            <td class="p-4 font-bold text-amber-900 border-r border-slate-200 bg-slate-50/50 text-xl font-serif">
                                <span id="math-tan"></span>
                            </td>
                            <td class="p-2 border-r border-slate-200 cursor-pointer cell-transition" onclick="toggleCell('tan', '0')">
                                <div id="cell-tan-0" class="min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium"></div>
                            </td>
                            <td class="p-2 border-r border-slate-200 cursor-pointer cell-transition" onclick="toggleCell('tan', '30')">
                                <div id="cell-tan-30" class="min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium"></div>
                            </td>
                            <td class="p-2 border-r border-slate-200 cursor-pointer cell-transition" onclick="toggleCell('tan', '45')">
                                <div id="cell-tan-45" class="min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium"></div>
                            </td>
                            <td class="p-2 border-r border-slate-200 cursor-pointer cell-transition" onclick="toggleCell('tan', '60')">
                                <div id="cell-tan-60" class="min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium"></div>
                            </td>
                            <td class="p-2 cursor-pointer cell-transition" onclick="toggleCell('tan', '90')">
                                <div id="cell-tan-90" class="min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Tip / Info Message Banner -->
        <div class="w-full bg-amber-50 border border-amber-200 rounded-xl p-3 text-center text-sm text-amber-800 flex items-center justify-center gap-2 shadow-sm">
            <span class="text-amber-500">💡</span>
            <span>표 안의 각 칸을 클릭하면 <b>KaTeX 수식</b>과 함께 해당 삼각비 음성이 재생됩니다!</span>
        </div>
    </main>

    <script>
        // Data structure for trigonometric values and Korean reading text
        const trigData = {
            'sin-0':  { latex: '0', speechName: '사인 영도는 0' },
            'sin-30': { latex: '\\frac{1}{2}', speechName: '사인 삼십도는 2분의 1' },
            'sin-45': { latex: '\\frac{\\sqrt{2}}{2}', speechName: '사인 사십오도는 2분의 루트 2' },
            'sin-60': { latex: '\\frac{\\sqrt{3}}{2}', speechName: '사인 육십도는 2분의 루트 3' },
            'sin-90': { latex: '1', speechName: '사인 구십도는 1' },

            'cos-0':  { latex: '1', speechName: '코사인 영도는 1' },
            'cos-30': { latex: '\\frac{\\sqrt{3}}{2}', speechName: '코사인 삼십도는 2분의 루트 3' },
            'cos-45': { latex: '\\frac{\\sqrt{2}}{2}', speechName: '코사인 사십오도는 2분의 루트 2' },
            'cos-60': { latex: '\\frac{1}{2}', speechName: '코사인 육십도는 2분의 1' },
            'cos-90': { latex: '0', speechName: '코사인 구십도는 0' },

            'tan-0':  { latex: '0', speechName: '탄젠트 영도는 0' },
            'tan-30': { latex: '\\frac{\\sqrt{3}}{3}', speechName: '탄젠트 삼십도는 3분의 루트 3' },
            'tan-45': { latex: '1', speechName: '탄젠트 사십오도는 1' },
            'tan-60': { latex: '\\sqrt{3}', speechName: '탄젠트 육십도는 루트 3' },
            'tan-90': { latex: '\\text{값 없음}', speechName: '탄젠트 구십도는 값이 없습니다' }
        };

        // App State
        let cellVisibility = {};
        let speechRate = 1.0;
        let isSpeakingAll = false;

        // Initialize all keys to invisible by default
        Object.keys(trigData).forEach(key => {
            cellVisibility[key] = false;
        });

        window.onload = function() {
            // Render Math headers using KaTeX
            katex.render("A", document.getElementById('math-A'));
            katex.render("\\sin A", document.getElementById('math-sin'));
            katex.render("\\cos A", document.getElementById('math-cos'));
            katex.render("\\tan A", document.getElementById('math-tan'));

            // Render Cells
            renderTable();
        };

        // Render entire table based on state
        function renderTable() {
            Object.keys(trigData).forEach(key => {
                const element = document.getElementById(`cell-${key}`);
                if (!element) return;

                if (cellVisibility[key]) {
                    element.innerHTML = `<span id="katex-${key}"></span>`;
                    element.className = "min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium bg-indigo-50/80 text-indigo-900 border border-indigo-200/60 shadow-inner";
                    katex.render(trigData[key].latex, document.getElementById(`katex-${key}`));
                } else {
                    element.innerHTML = `<i class="fa-solid fa-question text-slate-300 text-sm"></i>`;
                    element.className = "min-h-[52px] flex items-center justify-center rounded-lg p-2 font-medium bg-slate-50 hover:bg-slate-100 border border-dashed border-slate-300 text-slate-400";
                }
            });
        }

        // Toggle cell visibility and play speech
        function toggleCell(func, angle) {
            const key = `${func}-${angle}`;
            cellVisibility[key] = !cellVisibility[key];
            renderTable();

            if (cellVisibility[key]) {
                speakText(trigData[key].speechName);
            }
        }

        // Show all cells
        function showAllCells() {
            Object.keys(cellVisibility).forEach(key => {
                cellVisibility[key] = true;
            });
            renderTable();
        }

        // Hide all cells
        function hideAllCells() {
            Object.keys(cellVisibility).forEach(key => {
                cellVisibility[key] = false;
            });
            renderTable();
            window.speechSynthesis.cancel();
        }

        // Speech Synthesizer Function
        function speakText(text, onEndCallback) {
            if (!('speechSynthesis' in window)) {
                console.warn("TTS Web Speech API not supported");
                if (onEndCallback) onEndCallback();
                return;
            }

            window.speechSynthesis.cancel(); // Stop current speech

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = speechRate;

            if (onEndCallback) {
                utterance.onend = onEndCallback;
            }

            window.speechSynthesis.speak(utterance);
        }

        // Sequential Speech Reader
        function speakAll() {
            if (isSpeakingAll) {
                window.speechSynthesis.cancel();
                isSpeakingAll = false;
                document.getElementById('speechBtnText').innerText = "음성: 전체 읽기 (사인 삼십도는 2분의 1)";
                return;
            }

            showAllCells();
            isSpeakingAll = true;
            document.getElementById('speechBtnText').innerText = "음성 읽기 정지";

            const keys = Object.keys(trigData);
            let index = 0;

            function playNext() {
                if (!isSpeakingAll || index >= keys.length) {
                    isSpeakingAll = false;
                    document.getElementById('speechBtnText').innerText = "음성: 전체 읽기 (사인 삼십도는 2분의 1)";
                    return;
                }

                const currentKey = keys[index];
                // Highlight active cell visually
                const activeEl = document.getElementById(`cell-${currentKey}`);
                if (activeEl) {
                    activeEl.classList.add('ring-2', 'ring-emerald-500', 'bg-emerald-100');
                }

                speakText(trigData[currentKey].speechName, () => {
                    if (activeEl) {
                        activeEl.classList.remove('ring-2', 'ring-emerald-500', 'bg-emerald-100');
                    }
                    index++;
                    setTimeout(playNext, 300);
                });
            }

            playNext();
        }

        // Update speech speed
        function updateSpeechSpeed(val) {
            speechRate = parseFloat(val);
        }
    </script>
</body>
</html>
